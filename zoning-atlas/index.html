<style>
/* Layout: full-bleed map with a drafting-table panel on the left; the panel becomes a bottom sheet on phones. */
:root {
  --bg: #eef2f4; --panel: #ffffff; --ink: #17222b; --muted: #5b6a74; --rule: #d6dee3; --accent: #1f5f8b;
  --chip: #e8eff3; --water: #d7e2e8; --land: #f1f3f1; --block: #ffffff; --block-line: #c9d1d5; --scan-ink: #000;
  --z-R1: #5f9a45; --z-R2: #e3d27e; --z-C: #c63d2b; --z-LI: #3b7cb3; --z-HI: #6c4899; --z-U: #e0892a;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --panel-w: 372px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151a; --panel: #141d23; --ink: #e2e8ec; --muted: #94a4ae; --rule: #263540; --accent: #74b2de;
  --chip: #1d2a33; --water: #0b1317; --land: #18222a; --block: #202b33; --block-line: #2f3d47; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e151a; --panel: #141d23; --ink: #e2e8ec; --muted: #94a4ae; --rule: #263540; --accent: #74b2de;
  --chip: #1d2a33; --water: #0b1317; --land: #18222a; --block: #202b33; --block-line: #2f3d47; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
.app { position: relative; height: 100%; display: grid; grid-template-columns: var(--panel-w) 1fr; }
#map { position: relative; min-width: 0; height: 100%; background: var(--water); }

.panel { min-width: 0; height: 100%; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 20px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 6px 0 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
section { display: flex; flex-direction: column; gap: 10px; }

.years { display: flex; flex-wrap: wrap; gap: 6px; }
.year { font-family: var(--f-mono); font-size: 12px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 3px; background: transparent; color: var(--muted); }
.year[aria-current="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.year:disabled { opacity: .55; cursor: not-allowed; }

.control { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }
.control label { font-weight: 500; }
.control input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { font: 500 12px var(--f-body); padding: 5px 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
.toggle { width: 16px; height: 16px; accent-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.legend button { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; text-align: left;
  padding: 6px 6px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
.legend button:hover { background: var(--chip); }
.legend button[aria-pressed="true"] { background: var(--chip); box-shadow: inset 0 0 0 1px var(--rule); }
.legend .sw { width: 22px; height: 16px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.legend .name { min-width: 0; }
.legend .bar { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: var(--rule); }
.legend .bar i { display: block; height: 100%; border-radius: 2px; }
.legend .ac { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); }

.lgroup summary { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 4px 6px; font-weight: 500; }
.lgroup summary .sw { width: 22px; height: 16px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.lgroup summary .ac { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.lgroup summary .name::after { content: " \25B8"; color: var(--muted); }
.lgroup[open] summary .name::after { content: " \25BE"; }
.fix > summary { display: inline-block; margin: 2px 0 6px; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 4px; list-style: none; }
.fix > summary::-webkit-details-marker { display: none; }
.detail { border-top: 1px solid var(--rule); padding-top: 18px; }
.zone-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; padding: 2px 8px 2px 4px; border-radius: 3px; background: var(--chip); }
.zone-chip i { width: 12px; height: 12px; border-radius: 2px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.flag { font-size: 12px; padding: 6px 8px; border-radius: 4px; background: var(--chip); color: var(--ink); }
details { border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; }
details[open] { padding-bottom: 10px; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 6px 0 0; padding-left: 18px; }
details li { margin: 2px 0; }
.cite { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.hint { color: var(--muted); }

.maplibregl-ctrl-attrib { font-size: 10px; }
.scale-badge { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 28px; z-index: 2; font-family: var(--f-mono); font-size: 11px;
  background: var(--panel); color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); color: var(--muted); pointer-events: none; z-index: 1; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(0, 46%); }
  #map { grid-row: 1; }
  .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--rule); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); gap: 18px; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<style>
.select { font: 500 12px var(--f-body); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); }
.legend .sw.pub { background: repeating-linear-gradient(45deg, var(--rule) 0 3px, transparent 3px 6px) !important; }
.ramp { display: flex; flex-direction: column; gap: 4px; }
.ramp .bar { height: 10px; border-radius: 2px; }
.ramp .ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.history { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.history dt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.history dd { margin: 0; display: flex; align-items: center; gap: 6px; }
.history dd i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.history .now { font-weight: 600; }
.fix summary { color: var(--accent); }
.fix-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.fix-form label { font-weight: 500; margin-top: 4px; }
.fix-form textarea, .fix-form input[type=email] { font: 13px var(--f-body); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); width: 100%; box-sizing: border-box; }
.fix-form .select { width: 100%; font-size: 13px; padding: 6px; }
.btn { align-self: flex-start; margin-top: 6px; font: 600 13px var(--f-body); padding: 7px 14px; border: 0; border-radius: 4px; background: var(--ink); color: var(--panel); cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
#source a { color: var(--accent); }
</style>

<div class="app">
  <aside class="panel" aria-label="Map controls and block details">
    <header>
      <div class="eyebrow">Historical Zoning Atlas</div>
      <h1 id="title">Historical Zoning Atlas</h1>
      <p class="lede" id="lede"></p>
      <div class="control" id="city-row" hidden>
        <label for="city-menu">City</label>
        <select id="city-menu" class="select"></select>
      </div>
    </header>

    <section aria-labelledby="h-year">
      <h2 id="h-year">Map year</h2>
      <div class="years" id="years"></div>
    </section>

    <section aria-labelledby="h-layers">
      <h2 id="h-layers">Layers</h2>
      <div class="control">
        <label for="scan-on" id="scan-label">Scanned map</label>
        <input id="scan-on" class="toggle" type="checkbox" checked>
        <input id="scan-op" type="range" min="0" max="100" value="55" aria-label="Scanned map opacity">
      </div>
      <div class="control">
        <label for="zones-on">Districts</label>
        <input id="zones-on" class="toggle" type="checkbox" checked>
        <input id="zones-op" type="range" min="0" max="100" value="70" aria-label="District opacity">
      </div>
      <div class="control">
        <label for="color-by">Color by</label>
        <select id="color-by" class="select">
          <option value="zone">District</option>
          <option value="hatch">District, original legend</option>
          <option value="max_far">Floor area ratio limit</option>
          <option value="height_limit_ft">Height limit</option>
          <option value="lot_sqft_per_unit">Lot area per dwelling unit</option>
        </select>
      </div>
    </section>

    <section aria-labelledby="h-source">
      <h2 id="h-source">Source</h2>
      <p class="note" id="source"></p>
    </section>

    <section aria-labelledby="h-legend">
      <h2 id="h-legend">Districts</h2>
      <div id="legend-wrap"></div>
      <p class="note" id="legend-note"></p>
    </section>

    <section class="detail" id="detail" aria-live="polite"></section>
  </aside>
  <div id="map" role="region" aria-label="Map of zoning districts">
    <div class="loading" id="loading">Loading map…</div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async () => {
const FORM = {
  max_far: { label: "Floor area ratio limit", unit: "", stops: [0, 3.6, 5, 10, 20], colors: ["#eef3f7", "#b9d1e4", "#7aa6cb", "#3f78ad", "#173f73"], none: "No FAR limit (height and coverage rules)" },
  height_limit_ft: { label: "Height limit", unit: " ft", stops: [30, 35, 40, 75], colors: ["#fff1d6", "#f6c97b", "#e5953a", "#a8561b"], none: "No fixed height limit" },
  lot_sqft_per_unit: { label: "Lot area per dwelling unit", unit: " sq ft", stops: [125, 400, 1500, 4000], colors: ["#7a1f1f", "#c45a3a", "#eba872", "#fbe7c6"], none: "No per-unit rule" },
};
// Where corrections go: the URL of a deployed Google Apps Script web app (see corrections_apps_script.gs).
// Empty means the form shows but can't send yet.
const CORRECTIONS_URL = "https://script.google.com/macros/s/AKfycbxktrSSe32LcGjM8__OAcUHAhohkKvlyOKsin0umobdptwnTpVtiWlYJ0GYdN9fS9hG/exec";
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n, d = 0) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Which city: ?city=<slug>; the first entry in cities.json otherwise.
let cities;
try { cities = await getJSON("cities.json"); }
catch (e) { $("loading").textContent = "The map data did not load. Reload the page to try again."; console.error(e); return; }
const wanted = new URLSearchParams(location.search).get("city");
const city = cities.find(c => c.slug === wanted) || cities[0];
const BASE = `${city.slug}/`;
const PDFS = city.pdfs || {};
document.title = `${city.name} · Historical Zoning Atlas`;
if (cities.length > 1) {
  $("city-menu").innerHTML = cities.map(c => `<option value="${esc(c.slug)}"${c === city ? " selected" : ""}>${esc(c.name)}</option>`).join("");
  $("city-row").hidden = false;
  $("city-menu").addEventListener("change", (e) => { location.href = `?city=${encodeURIComponent(e.target.value)}`; });
}
const TODAY = city.today_year ?? null;   // the current-zoning layer, where a city has one
const BLOCK_LABEL = city.block_label || "Block";
const yearName = (y) => y === TODAY ? "Today" : String(y);
let years = [], year = null, data = {}, filterZone = null, hoverId = null, selectedId = null, colorBy = "zone";

function themeColors() {
  return { water: css("--water"), land: css("--land"), block: css("--block"), blockLine: css("--block-line"), ink: css("--ink"), muted: css("--muted"), rule: css("--rule") };
}

// 1921 legend hatching, drawn the way the map's legend shows it.
function hatchImage(z) {
  const s = 24, c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, s, s);
  g.strokeStyle = "#111"; g.fillStyle = "#111"; g.lineWidth = 2.2;
  const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  if (z === "R1") { for (let o = -s; o <= s; o += 12) line(o, s, o + s, 0); }
  if (z === "C") { g.fillRect(0, 0, s, s); }
  if (z === "LI") { for (let o = -s; o <= s; o += 8) { line(o, s, o + s, 0); line(o, 0, o + s, s); } }
  if (z === "HI") { g.lineWidth = 1.8; for (let o = 0; o <= s; o += 6) { line(o, 0, o, s); line(0, o, s, o); } }
  if (z === "U") { for (let y = 0; y < s; y += 6) for (let x = 0; x < s; x += 6) if (((x + y) / 6) % 2 === 0) g.fillRect(x, y, 6, 6); }
  if (z === "PUBLIC") { g.strokeStyle = "#888"; g.lineWidth = 1; for (let o = -s; o <= s; o += 6) line(o, 0, o + s, s); }
  return g.getImageData(0, 0, s, s);
}

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8, sources: {}, layers: [{ id: "water", type: "background", paint: { "background-color": themeColors().water } }] },
  center: city.view.center, zoom: city.view.zoom, minZoom: city.view.minZoom, maxZoom: 18, attributionControl: false,
  maxBounds: city.view.maxBounds,
});
window.atlasMap = map;
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-left");
map.addControl(new maplibregl.AttributionControl({ compact: true,
  customAttribution: city.attribution }), "bottom-right");

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); }

async function loadYear(y) {
  if (!data[y]) {
    const rules = await getJSON(`${BASE}data/rules_${y}.json`);
    const [zones, scan, summary] = await Promise.all([
      getJSON(`${BASE}data/zones_${y}.geojson`), rules.no_scan ? null : getJSON(`${BASE}data/scan_${y}.json`), getJSON(`${BASE}data/summary_${y}.json`)]);
    zones.features.forEach((f, i) => { f.id = i; f.bbox = bboxOf(f.geometry); });
    const byCode = Object.fromEntries(rules.zones.map(z => [z.code, z]));
    data[y] = { zones, scan, rules, summary, byCode };
  }
  return data[y];
}

function bboxOf(g) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  const walk = (c) => { if (typeof c[0] === "number") { b = [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])]; } else c.forEach(walk); };
  walk(g.coordinates); return b;
}
function inRing(p, r) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPoly(p, poly) { return inRing(p, poly[0]) && !poly.slice(1).some(h => inRing(p, h)); }
function zoneAt(y, p) {
  const d = data[y]; if (!d) return undefined;
  for (const f of d.zones.features) {
    const b = f.bbox; if (p[0] < b[0] || p[0] > b[2] || p[1] < b[1] || p[1] > b[3]) continue;
    const g = f.geometry;
    if ((g.type === "Polygon" && inPoly(p, g.coordinates)) || (g.type === "MultiPolygon" && g.coordinates.some(c => inPoly(p, c)))) return f.properties;
  }
  return null;
}

function fillColorExpr() {
  const d = data[year], tc = themeColors();
  if (colorBy === "zone" || colorBy === "hatch") {
    return ["match", ["get", "zone"], ...d.rules.zones.flatMap(z => [z.code, z.color]), "PUBLIC", tc.rule, "#999"];
  }
  const f = FORM[colorBy];
  const steps = ["step", ["to-number", ["get", colorBy], -1], tc.rule, ...f.stops.flatMap((s, i) => [s, f.colors[i]])];
  return ["case", ["==", ["get", colorBy], null], tc.rule, steps];
}

function applyStyle() {
  const on = $("zones-on").checked, hatch = colorBy === "hatch";
  map.setPaintProperty("zones", "fill-color", fillColorExpr());
  map.setLayoutProperty("zones", "visibility", on && !hatch ? "visible" : "none");
  map.setLayoutProperty("zones-hatch", "visibility", on && hatch ? "visible" : "none");
  map.setLayoutProperty("zones-line", "visibility", on ? "visible" : "none");
  if (map.getLayer("scan")) map.setLayoutProperty("scan", "visibility", $("scan-on").checked && data[year].scan ? "visible" : "none");
  const f = filterZone ? ["==", ["get", "zone"], filterZone] : null;
  ["zones", "zones-hatch", "zones-line"].forEach(id => map.setFilter(id, f));
  map.setFilter("zones-paper", f ? ["all", f, ["==", ["get", "unit"], "paper"]] : ["==", ["get", "unit"], "paper"]);
  map.setLayoutProperty("zones-paper", "visibility", on ? "visible" : "none");
  buildLegend();
}

function buildLegend() {
  const d = data[year];
  $("h-legend").hidden = colorBy in FORM;
  if (colorBy in FORM) {
    const f = FORM[colorBy];
    const has = d.zones.features.some(x => x.properties[colorBy] != null);
    $("legend-wrap").innerHTML = has ? `<div class="ramp">
      <div class="bar" style="background:linear-gradient(90deg,${f.colors.join(",")})"></div>
      <div class="ticks">${f.stops.map(s => `<span>${fmt(s)}${f.unit}</span>`).join("")}</div></div>`
      : `<p class="note">The ${year} ordinance sets no ${f.label.toLowerCase()}.</p>`;
    $("legend-note").textContent = has ? `${f.label} from the ${year} ordinance, by district. Gray: ${f.none.charAt(0).toLowerCase() + f.none.slice(1)} or public land.` : "";
    return;
  }
  const zoned = Object.values(d.summary.acres).reduce((a, b) => a + b, 0);   // public land has no district, so it isn't in this total
  const pct = (ac) => { const p = 100 * ac / zoned; return p > 0 && p < 0.1 ? "<0.1%" : `${fmt(p, 1)}%`; };
  const shown = d.rules.zones.filter(z => d.summary.acres[z.code] != null);
  const fam = (z) => z.family || "Residential";
  const famAcres = (f) => shown.filter(z => fam(z) === f).reduce((a, z) => a + d.summary.acres[z.code], 0);
  const row = (z) => {
    const ac = d.summary.acres[z.code];
    return `<li><button type="button" data-zone="${esc(z.code)}" aria-pressed="${filterZone === z.code}">
      <span class="sw" style="background:${z.color}"></span>
      <span class="name">${esc(z.code)} · ${esc(z.name)}<span class="bar"><i style="width:${(100 * ac / famAcres(fam(z))).toFixed(1)}%;background:${z.color}"></i></span></span>
      <span class="ac">${pct(ac)}</span></button></li>`;
  };
  const items = [];
  items.push(`<li><button type="button" data-zone="PUBLIC" aria-pressed="${filterZone === "PUBLIC"}">
      <span class="sw pub"></span><span class="name">Public land</span><span class="ac">not zoned</span></button></li>`);
  const openAll = shown.length <= 25;
  const groups = [...new Set(shown.map(fam))].map(f => {
    const m = shown.filter(z => fam(z) === f), tot = m.reduce((a, z) => a + d.summary.acres[z.code], 0);
    return `<details class="lgroup" ${openAll || m.some(z => z.code === filterZone) ? "open" : ""}><summary><span class="sw" style="background:${m[Math.floor(m.length / 2)].color}"></span><span class="name">${esc(f)}</span><span class="ac">${pct(tot)}</span></summary><ul class="legend">${m.map(row).join("")}</ul></details>`;
  }).join("");
  $("legend-wrap").innerHTML = `<div id="legend">${groups}<ul class="legend">${items.join("")}</ul></div>`;
  const paper = d.summary.paper_acres ? ` Not included: ${fmt(d.summary.paper_acres)} acres of paper blocks (dashed outlines), zoned on the map but with no block today, ${fmt(d.summary.paper_water_acres || 0)} of them under water in 1947.` : "";
  $("legend-note").textContent = (d.rules.no_scan ? "Open a group, then click a district to show it alone. " : "Click a district to show it alone. ") + "Percentages are of zoned land, excluding streets. Bars show each district's share of its group." + paper;
  $("legend").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-zone]"); if (!b) return;
    filterZone = filterZone === b.dataset.zone ? null : b.dataset.zone;
    applyStyle();
  });
}

function renderYears() {
  $("years").innerHTML = years.map(y =>
    `<button type="button" class="year" data-year="${y}" ${y === year ? 'aria-current="true"' : ""}>${yearName(y)}</button>`).join("");
}

async function setYear(y) {
  const d = await loadYear(y);
  year = y; filterZone = null; selectedId = null; hoverId = null;
  map.getSource("zones").setData(d.zones);
  const scanUrl = `${BASE}data/scan_${y}.webp`;
  if (d.scan && map.getSource("scan").url !== scanUrl) map.getSource("scan").updateImage({ url: scanUrl, coordinates: d.scan.coordinates });
  $("title").textContent = `${city.name}, ${y === TODAY ? "today" : y}`;
  $("lede").textContent = y === TODAY ? `${d.rules.ordinance}. Click any block to see its district today and how the same land was zoned in other years.` : `${d.rules.ordinance}. Click any block to see what the ${y} rules allowed there and how the same land was zoned in other years.`;
  $("scan-label").textContent = d.scan ? "Scanned map" : y === TODAY ? "Scanned map (none for today)" : "Scanned map (none for this year)";
  $("scan-on").disabled = $("scan-op").disabled = !d.scan;
  const hatchOpt = $("color-by").querySelector('option[value="hatch"]');
  hatchOpt.disabled = !d.summary.has_hatch;
  if (colorBy === "hatch" && !d.summary.has_hatch) { colorBy = "zone"; $("color-by").value = "zone"; }
  // Form fields the ordinance did not regulate in this year can't be picked.
  for (const fld in FORM) {
    const opt = $("color-by").querySelector(`option[value="${fld}"]`);
    const has = d.zones.features.some(x => x.properties[fld] != null);
    opt.disabled = !has;
    opt.textContent = FORM[fld].label + (has ? "" : y === TODAY ? " (not in today's data)" : ` (not regulated in ${y})`);
    if (colorBy === fld && !has) { colorBy = "zone"; $("color-by").value = "zone"; }
  }
  const pdf = PDFS[y];
  $("source").innerHTML = pdf
    ? `${esc(d.rules.map_title || "Zoning map")}. <a href="${BASE}pdf/${pdf}" target="_blank" rel="noopener">View the original scans</a>`
    : `${esc(d.rules.map_title || "")}${d.rules.source_url ? `. <a href="${esc(d.rules.source_url)}" target="_blank" rel="noopener">Open the city's data</a>${d.rules.official_map_url ? ` or <a href="${esc(d.rules.official_map_url)}" target="_blank" rel="noopener">the official zoning map</a>` : ""}` : ""}`;
  renderYears(); applyStyle(); showSummary();
  try { history.replaceState(null, "", `#y${y}`); } catch (e) {}
  // Other years load in the background for the "same land in other years" panel.
  years.filter(o => o !== y).forEach(o => loadYear(o).catch(() => {}));
}

map.on("load", async () => {
  try {
    years = await getJSON(`${BASE}data/years.json`);
    const [land, blocks] = await Promise.all([getJSON(`${BASE}data/basemap_land.geojson`), getJSON(`${BASE}data/basemap_blocks.geojson`)]);
    const first = years.includes(Number((location.hash.match(/^#y(\d{4})$/) || [])[1])) ? Number(location.hash.slice(2)) : years[0];
    const d = await loadYear(first);
    // The image source starts on any year that has a scan; a city may have none.
    let scanFrom = first, scanData = d;
    if (!d.scan) for (const y of years) { const o = await loadYear(y); if (o.scan) { scanFrom = y; scanData = o; break; } }
    const tc = themeColors();
    ["R1", "C", "LI", "HI", "U", "PUBLIC"].forEach(z => map.addImage(`hatch-${z}`, hatchImage(z), { pixelRatio: 2 }));
    map.addImage("hatch-R2", hatchImage("R2"), { pixelRatio: 2 });
    map.addSource("land", { type: "geojson", data: land });
    map.addSource("blocks", { type: "geojson", data: blocks });
    if (scanData.scan) map.addSource("scan", { type: "image", url: `${BASE}data/scan_${scanFrom}.webp`, coordinates: scanData.scan.coordinates });
    map.addSource("zones", { type: "geojson", data: d.zones });
    map.addLayer({ id: "land", type: "fill", source: "land", paint: { "fill-color": tc.land } });
    map.addLayer({ id: "blocks", type: "fill", source: "blocks", paint: { "fill-color": tc.block } });
    map.addLayer({ id: "blocks-line", type: "line", source: "blocks", paint: { "line-color": tc.blockLine, "line-width": ["interpolate", ["linear"], ["zoom"], 12, 0.2, 16, 1] } });
    if (scanData.scan) map.addLayer({ id: "scan", type: "raster", source: "scan", paint: { "raster-opacity": 0.55, "raster-fade-duration": 0 } });
    map.addLayer({ id: "zones", type: "fill", source: "zones", paint: { "fill-color": "#999", "fill-opacity": 0.7 } });
    map.addLayer({ id: "zones-hatch", type: "fill", source: "zones", layout: { visibility: "none" },
      paint: { "fill-pattern": ["concat", "hatch-", ["get", "zone"]], "fill-opacity": 0.85 } });
    map.addLayer({ id: "zones-line", type: "line", source: "zones",
      paint: { "line-color": tc.ink, "line-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0, 15, 0.35], "line-width": 0.5 } });
    map.addLayer({ id: "zones-paper", type: "line", source: "zones", filter: ["==", ["get", "unit"], "paper"],
      paint: { "line-color": tc.ink, "line-width": 1, "line-dasharray": [2, 2], "line-opacity": 0.7 } });
    map.addLayer({ id: "zones-hover", type: "line", source: "zones",
      paint: { "line-color": tc.ink, "line-width": ["case", ["boolean", ["feature-state", "sel"], false], 3, 1.5],
        "line-opacity": ["case", ["boolean", ["feature-state", "sel"], false], 1, ["boolean", ["feature-state", "hover"], false], 0.8, 0] } });
    map.fitBounds(city.view.fit, { padding: 20, duration: 0 });
    wire();
    await setYear(first);
    $("loading").hidden = true;
  } catch (e) {
    $("loading").textContent = "The map data did not load. Reload the page to try again.";
    console.error(e);
  }
});

function wire() {
  $("scan-on").addEventListener("change", applyStyle);
  $("zones-on").addEventListener("change", applyStyle);
  $("scan-op").addEventListener("input", (e) => map.setPaintProperty("scan", "raster-opacity", e.target.value / 100));
  $("zones-op").addEventListener("input", (e) => {
    map.setPaintProperty("zones", "fill-opacity", e.target.value / 100);
    map.setPaintProperty("zones-hatch", "fill-opacity", Math.min(1, e.target.value / 100 + 0.15));
  });
  $("color-by").addEventListener("change", (e) => { colorBy = e.target.value; filterZone = null; applyStyle(); });
  $("years").addEventListener("click", (e) => { const b = e.target.closest("button[data-year]"); if (b) setYear(Number(b.dataset.year)); });

  // Query only the visible district layer: a hidden layer in the list makes the query return nothing.
  const pick = (pt) => $("zones-on").checked
    ? map.queryRenderedFeatures(pt, { layers: [colorBy === "hatch" ? "zones-hatch" : "zones"] })[0] : undefined;
  map.on("mousemove", (e) => {
    const f = pick(e.point);
    if (hoverId !== null) map.setFeatureState({ source: "zones", id: hoverId }, { hover: false });
    hoverId = f ? f.id : null;
    if (hoverId !== null) map.setFeatureState({ source: "zones", id: hoverId }, { hover: true });
    map.getCanvas().style.cursor = f ? "pointer" : "";
  });
  map.on("click", (e) => {
    const f = pick(e.point);
    if (selectedId !== null) map.setFeatureState({ source: "zones", id: selectedId }, { sel: false });
    selectedId = f ? f.id : null;
    if (f) { map.setFeatureState({ source: "zones", id: f.id }, { sel: true }); showDetail(f.properties, [e.lngLat.lng, e.lngLat.lat]); $("detail").scrollIntoView({ block: "start" }); }
    else showSummary([e.lngLat.lng, e.lngLat.lat]);
  });

  const retheme = () => {
    const tc = themeColors();
    map.setPaintProperty("water", "background-color", tc.water);
    map.setPaintProperty("land", "fill-color", tc.land);
    map.setPaintProperty("blocks", "fill-color", tc.block);
    map.setPaintProperty("blocks-line", "line-color", tc.blockLine);
    map.setPaintProperty("zones-line", "line-color", tc.ink);
    map.setPaintProperty("zones-hover", "line-color", tc.ink);
    if (year) applyStyle();
  };
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}

function list(items) { return items && items.length ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class='hint'>None listed.</p>"; }

function showSummary(lngLat) {
  const r = data[year].rules;
  $("detail").innerHTML = `
    <h2>${year === TODAY ? "About today's zoning" : `About the ${year} map`}</h2>
    <p>${esc(r.structure)}</p>
    <p class="hint">${esc(r.hierarchy)}</p>
    ${r.method ? `<p class="cite">${esc(r.ordinance)}. ${esc(r.method)}</p>` : `<p class="cite">${esc(r.ordinance)}. Districts were read from the section sheets of the ${esc((r.map_title || "").split(",")[0])} and assigned to today's ${esc(BLOCK_LABEL.toLowerCase())}s. Parks and federal land are shown without a district.</p>`}
    ${lngLat ? correctionForm({ lngLat, zone: null, block: null }) : ""}`;
  if (lngLat) wireCorrection();
}

function correctionForm(c) {
  const d = data[year];
  const opts = d.rules.zones.filter(z => z.code !== c.zone)
    .map(z => `<option value="${esc(z.code)}">${esc(z.code)} · ${esc(z.name)}</option>`).join("");
  const mapName = year === TODAY ? "today's map" : `the ${year} map`;
  const what = c.zone ? `This block shows <b>${esc(c.zone === "PUBLIC" ? "public land" : c.zone)}</b> on ${mapName}.` : `No district is shown at this point on ${mapName}.`;
  const ask = year === TODAY ? "If that looks wrong, tell us what you see." : "If the scanned map shows something else, tell us what.";
  return `<details class="fix" id="fix"><summary>Suggest a correction</summary>
    <form id="fix-form" class="fix-form" data-zone="${esc(c.zone || "")}" data-block="${esc(c.block || "")}" data-lng="${c.lngLat[0].toFixed(6)}" data-lat="${c.lngLat[1].toFixed(6)}">
      <p class="hint">${what} ${ask}</p>
      <label for="fix-zone">${year === TODAY ? "District it should show" : `District on the ${year} map`}</label>
      <select id="fix-zone" class="select" required>
        <option value="">Choose…</option>${opts}
        ${c.zone !== "PUBLIC" ? `<option value="PUBLIC">Public land</option>` : ""}
        <option value="other">Something else (describe below)</option>
      </select>
      <label for="fix-note">What you see <span class="hint">(optional)</span></label>
      <textarea id="fix-note" rows="3" maxlength="1000" placeholder="${year === TODAY ? "For example: this block is zoned RH-2, not RH-1." : "For example: the label on sheet 5 reads R-2 for the whole block."}"></textarea>
      <label for="fix-email">Email <span class="hint">(optional, if you'd like a reply)</span></label>
      <input id="fix-email" type="email" maxlength="200" autocomplete="email">
      <button type="submit" class="btn">Send correction</button>
      <p class="note" id="fix-status" role="status"></p>
    </form></details>`;
}

function wireCorrection() {
  const f = $("fix-form"); if (!f) return;
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const st = $("fix-status");
    if (!$("fix-zone").value) { st.textContent = "Choose a district first."; return; }
    if (!CORRECTIONS_URL) { st.textContent = "Corrections aren't connected yet. Please try again later."; return; }
    const body = {
      city: city.name, year, block_num: f.dataset.block || null, zone_shown: f.dataset.zone || null,
      zone_suggested: $("fix-zone").value, note: $("fix-note").value.trim(), email: $("fix-email").value.trim(),
      lng: Number(f.dataset.lng), lat: Number(f.dataset.lat), page: location.href, sent_at: new Date().toISOString(),
    };
    f.querySelector("button").disabled = true; st.textContent = "Sending…";
    try {
      // text/plain keeps this a simple request, which Apps Script accepts without a CORS preflight.
      const res = await fetch(CORRECTIONS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      if ((await res.text()).trim() !== "ok") throw new Error("not saved");
      st.textContent = "Thanks. Your correction was sent.";
      f.querySelectorAll("select, textarea, input").forEach(x => x.disabled = true);
    } catch (err) {
      st.textContent = "That didn't send. Check your connection and try again.";
      f.querySelector("button").disabled = false;
    }
  });
}

function historyRows(p) {
  return years.map(y => {
    const z = y === year ? null : zoneAt(y, p), lab = yearName(y);
    if (y === year) return "";
    if (z === undefined) return `<dt>${lab}</dt><dd class="hint">loading…</dd>`;
    if (z === null) return `<dt>${lab}</dt><dd class="hint">not mapped here</dd>`;
    if (z.zone === "PUBLIC") return `<dt>${lab}</dt><dd class="hint">public land</dd>`;
    const r = data[y].byCode[z.zone] || {};
    return `<dt>${lab}</dt><dd><i style="background:${r.color || "#999"}"></i>${esc(z.zone)} · ${esc(r.name || "")}</dd>`;
  }).join("");
}

function showDetail(p, lngLat) {
  const d = data[year];
  const facts = (extra) => `<dl class="facts">
      <dt>${esc(BLOCK_LABEL)}</dt><dd>${p.block_num && p.block_num !== "null" ? esc(p.block_num) : "none today"}</dd>
      <dt>Area</dt><dd>${fmt(p.acres, 2)} acres</dd>
      ${year === TODAY || TODAY === null ? "" : `<dt>Zoned today</dt><dd>${p.today && p.today !== "null" ? esc(p.today) : "n/a"}</dd>`}${extra || ""}
    </dl>`;
  const hist = years.length > 1 ? `<h2>Same land in other years</h2><dl class="history">${historyRows(lngLat)}</dl>` : "";
  if (p.zone === "PUBLIC") {
    $("detail").innerHTML = `<h3>Public land</h3><p>${esc(String(p.public).replace(/^(park|federal): /, ""))} is ${String(p.public).startsWith("federal") ? "federal land" : "a city park today"}, so it is shown without a district.</p>
      ${correctionForm({ lngLat, zone: "PUBLIC", block: p.block_num })}${facts()}${hist}`;
    wireCorrection();
    return;
  }
  const r = d.byCode[p.zone];
  if (p.unit === "today") {
    const dist = (p.district && d.rules.districts[p.district]) || {};
    const sec = dist.section || r.section, url = dist.url || r.url, named = /^NC[DT]$/.test(p.zone) && dist.name;
    $("detail").innerHTML = `
    <div class="zone-chip"><i style="background:${r.color}"></i>${esc(p.zone)}${sec ? ` · Section ${esc(sec)}` : ""}</div>
    <h3>${esc(named || r.name)}</h3>
    <p>${esc(r.summary)}</p>
    ${correctionForm({ lngLat, zone: p.zone, block: p.block_num })}
    ${facts()}
    ${hist}
    <p class="cite">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Read this district's rules in the Planning Code</a>. ` : ""}${esc(d.rules.ordinance)}.</p>`;
    wireCorrection();
    return;
  }
  const notes = [];
  if (p.unit === "hist") notes.push("No block exists here today. This land was zoned on the old map before later streets, freeways or redevelopment changed it.");
  if (p.unit === "paper") notes.push(`A paper block: drawn and zoned on the ${year} map, but no block exists here today. ` +
    (p.water_1947 >= 0.5 ? "It was under water on the 1947 USGS map, so these lots were likely tidelands sold on paper and never built on. " : "") +
    (p.today_land < 0.5 ? "Most of it is bay today. " : "") + "Not counted in the district totals.");
  if (p.unit === "fill" && p.fill_source === "hand") notes.push(`Read by hand: no label reached this block automatically, so its district was assigned by looking at the ${year} map.`);
  else if (p.unit === "fill") notes.push(`Inferred: no district was read for this block on the ${year} map, so it is filled from ` +
    `nearby evidence (${p.fill_source && p.fill_source !== "null" ? p.fill_source : "neighboring districts"}).`);
  if (p.fix_source && p.fix_source !== "null") notes.push(`Corrected: ${p.fix_source.replace(/^read (\S+); /, `read as $1 on the ${year} map, but `)}. A district that changes for one map and changes back is treated as a misread.`);
  if (p.unit === "modern_large") notes.push("This is a large modern parcel; the district shown is the part the old map assigned.");
  if (String(p.split) === "true") notes.push(`The ${year} map put more than one district on this block; this is one part of it.`);
  const conf = p.share >= 0.8 ? "High" : p.share >= 0.6 ? "Medium" : "Low";
  const fr = r.form_rules && r.form_rules.length ? `<details open><summary>Building form rules</summary>${list(r.form_rules)}</details>` : "";
  $("detail").innerHTML = `
    <div class="zone-chip"><i style="background:${r.color}"></i>${esc(p.zone)}${r.section ? ` · Section ${esc(r.section)}` : ""}</div>
    <h3>${esc(r.name)}</h3>
    <p>${esc(r.summary)}</p>
    ${correctionForm({ lngLat, zone: p.zone, block: p.block_num && p.block_num !== "null" ? p.block_num : null })}
    ${facts(`${p.share == null ? "" : `<dt>${p.unit === "fill" ? "Inference confidence" : "Read confidence"}</dt><dd>${conf} (${Math.round(p.share * 100)}% of ${p.unit === "fill" ? "evidence" : "samples"})</dd>`}
      ${p.gcp_dist_ft == null ? "" : `<dt>Map placement</dt><dd>±${p.gcp_dist_ft < 300 ? "10" : p.gcp_dist_ft < 1000 ? "25" : "50+"} ft</dd>`}`)}
    ${notes.map(n => `<div class="flag">${esc(n)}</div>`).join("")}
    ${hist}
    <details open><summary>Permitted uses</summary>${list(r.permitted_uses)}</details>
    ${fr}
    ${r.conditional_uses && r.conditional_uses.length ? `<details><summary>Conditional uses</summary>${list(r.conditional_uses)}</details>` : ""}
    ${r.excluded_uses && r.excluded_uses.length ? `<details><summary>Excluded uses (${r.excluded_uses.length})</summary>${list(r.excluded_uses)}</details>` : ""}
    ${r.by_permit && r.by_permit.length ? `<details><summary>Allowed by permit</summary>${list(r.by_permit)}</details>` : ""}
    <p class="cite">${r.map_symbol ? `Map symbol: ${esc(r.map_symbol)}. ` : ""}${esc(d.rules.ordinance)}.</p>`;
  wireCorrection();
}
})();
</script>
</body></html>
